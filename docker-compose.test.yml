# Docker Compose 測試環境配置

services:
  # Ubuntu 測試環境（最新 LTS）
  ubuntu-test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ubuntu:latest
    image: linux-setting-test:ubuntu
    container_name: linux-setting-ubuntu-test
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - TZ=Asia/Taipei
      - TEST_ENVIRONMENT=docker
    volumes:
      - .:/opt/linux-setting
      - ubuntu-test-home:/home/testuser
    working_dir: /opt/linux-setting
    command: tail -f /dev/null  # 保持容器運行
    healthcheck:
      test: ["CMD", "python3", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Debian 測試環境（目前的 stable）
  debian-test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: debian:stable
    image: linux-setting-test:debian
    container_name: linux-setting-debian-test
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - TZ=Asia/Taipei
      - TEST_ENVIRONMENT=docker
    volumes:
      - .:/opt/linux-setting
      - debian-test-home:/home/testuser
    working_dir: /opt/linux-setting
    command: tail -f /dev/null
    profiles:
      - debian
    healthcheck:
      test: ["CMD", "python3", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 測試執行器
  test-runner:
    image: linux-setting-test:ubuntu
    container_name: linux-setting-test-runner
    depends_on:
      ubuntu-test:
        condition: service_healthy
    volumes:
      - .:/opt/linux-setting
      - test-reports:/opt/reports
    working_dir: /opt/linux-setting
    environment:
      - CI=true
      - REPORT_DIR=/opt/reports
    command: >
      /bin/bash -lc "
        set -euo pipefail
        echo '=== 開始自動測試 ==='
        sudo mkdir -p /opt/reports
        sudo chown -R testuser:testuser /opt/reports
        ./tests/run_all_tests.sh 2>&1 | tee /opt/reports/test_report_$(date +%Y%m%d_%H%M%S).log
        echo '=== 測試完成 ==='
      "
    profiles:
      - test

volumes:
  ubuntu-test-home:
    driver: local
  debian-test-home:
    driver: local
  test-reports:
    driver: local

networks:
  default:
    name: linux-setting-test-network
    driver: bridge
