name: Test Installation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 這個 workflow 只需要讀取程式碼
permissions:
  contents: read

# 防止同一個 PR 多次推送同時跑（節省 runner）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Static checks (always runs, fast feedback < 1 min)
  #    純語法 / shellcheck / 結構檢查，沒有任何安裝動作
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: bash -n on every shell script
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash syntax error"
              fail=1
            fi
          done < <(find . -type f \( -name "*.sh" -o -name "*.bash" \) \
                          -not -path "./.git/*" -not -path "./node_modules/*")
          exit $fail

      - name: ShellCheck errors gate
        env:
          CI: true
        run: bash tests/run_shellcheck.sh

      - name: Run unit-style script tests (test_scripts.sh)
        env:
          CI: true
          SKIP_NETWORK_TESTS: true
          NON_INTERACTIVE: true
        run: bash tests/test_scripts.sh

      - name: Run uninstall / rollback / hardening tests
        env:
          CI: true
        run: bash tests/test_uninstall.sh

      - name: Run remote-install bootstrap tests
        env:
          CI: true
        run: bash tests/test_bootstrap.sh

  # ---------------------------------------------------------------------------
  # 2. Functional tests (Linux runner, vanilla ubuntu)
  #    跑 test_dependencies + test_functionality；測試本身對 CI 環境友善
  # ---------------------------------------------------------------------------
  functional:
    name: Functional (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CI: true
      SKIP_NETWORK_TESTS: true
      NON_INTERACTIVE: true
      FORCE_LINUX_TESTS: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run unified test suite
        run: bash tests/run_all_tests.sh

  # ---------------------------------------------------------------------------
  # 3. Real install simulation (docker, slow but high-fidelity)
  #    在 docker 容器跑完整 install.sh，最接近使用者真實環境
  # ---------------------------------------------------------------------------
  #    只測各發行版的最新版本（浮動標籤），並涵蓋 x86_64 與 arm64。
  #    Kali 為滾動更新，列為實驗性：失敗不擋合併。
  install-simulation:
    name: Install (${{ matrix.distro }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: lint
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-latest
            base_image: ubuntu:latest
            arch: x86_64
            runner: ubuntu-latest
            experimental: false
          - distro: ubuntu-latest
            base_image: ubuntu:latest
            arch: arm64
            runner: ubuntu-24.04-arm
            experimental: false
          - distro: debian-stable
            base_image: debian:stable
            arch: x86_64
            runner: ubuntu-latest
            experimental: false
          - distro: debian-stable
            base_image: debian:stable
            arch: arm64
            runner: ubuntu-24.04-arm
            experimental: false
          - distro: kali-rolling
            base_image: kalilinux/kali-rolling
            arch: x86_64
            runner: ubuntu-latest
            experimental: true
    env:
      BASE_IMAGE: ${{ matrix.base_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build docker image
        run: ./docker-test.sh build

      - name: Run basic script tests inside docker
        run: ./docker-test.sh test

      - name: Run TUI smoke tests in a fresh container
        run: CONTAINER_NAME=ci-tui-smoke ./docker-test.sh run "CI=true bash tests/test_tui_smoke.sh"

      - name: Run Docker module install test in a fresh container
        run: CONTAINER_NAME=ci-docker-module ./docker-test.sh run "CI=true bash tests/test_docker_module.sh"

      - name: Run full installation simulation in a fresh container
        run: CONTAINER_NAME=ci-remote-install bash tests/test_full_simulation.sh
